[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "casefile-ai"
version = "0.1.0"
description = "CaseFile.ai — an AI business investigator. Accenture Innovation Challenge 2026, Round 2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Team Case Solvers" }]

# Stack per CLAUDE.md §"Stack". Upper bounds cap the next major so a surprise
# release cannot silently change statistical results between runs.
dependencies = [
  # Analytical store — single file, no server. CLAUDE.md §Stack.
  "duckdb>=1.1,<2.0",
  # Analytics
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scipy>=1.13,<2.0",
  "statsmodels>=0.14,<0.16",   # STL, OLS, DiD
  "ruptures>=1.1.9,<2.0",      # PELT changepoints (Test 1)
  "scikit-learn>=1.5,<2.0",    # isotonic calibration, covariate matching
  # Backend — the Pydantic models ARE the evidence/adjudication contracts.
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  # Semantic layer is YAML; no threshold may live in Python (rule 2).
  "pyyaml>=6.0,<7.0",
  # LLM. Only imported behind llm/provider.py; MOCK_LLM=true never touches it.
  "anthropic>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [
  "engine",
  "llm",
  "api",
  "security",
  "telemetry",
  "semantic_layer",
  "data",
]

[tool.pytest.ini_options]
# Repo root on sys.path so `make test` works without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
