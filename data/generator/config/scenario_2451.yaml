# Case #2451 — West, net revenue, Nov 2025 (monthly) -> PARTIALLY EXPLAINED
#
# THE CAUSAL CHAIN. Read this before changing a number.
#
# Nothing is added to treated stores' revenue. The decline is produced by
# one mechanism, applied at store x SKU x day:
#
#   1. A DC allocation fault starves 34 West stores of the affected SKUs.
#   2. Their on-shelf availability falls from ~94% to ~71% on the top-20.
#   3. Units are suppressed by an elasticity on availability:
#
#        units = units_base * (1 - beta * demand_weighted_gap)
#
#      where gap = 1 - availability, weighted by each SKU's demand share.
#   4. Revenue falls because units fell. Nothing else is touched.
#
# beta > 1 is basket abandonment: a shopper who came for an out-of-stock
# hero SKU sometimes leaves with nothing, losing the AVAILABLE items in
# the basket too. That is why the revenue loss exceeds the affected SKUs'
# own share, and it is the reason the effect is not merely proportional.
#
# The DiD, the dose-response r, and the parallel-trends p-value are all
# MEASURED off this mechanism. None of them is set.

