# Meridian Footwear India — the entity being simulated.
#
# Every number here is a TARGET the generator aims at, not an output it
# reports. CLAUDE.md rule 4: nothing on screen is a typed-in constant.
#
# NOTE ON REGIONAL DENSITY (reported, not invented):
# CLAUDE.md gives annual net revenue ~₹3,400 Cr, West ~₹1,000 Cr over 140
# stores, and East ₹34.5 Cr/month over 58 stores. That implies:
#
#   West  ₹1,004 Cr / 140 = ₹7.17 Cr per store per year
#   East  ₹  414 Cr /  58 = ₹7.14 Cr per store per year
#   N+S   ₹1,982 Cr / 214 = ₹9.26 Cr per store per year
#
# North and South stores must therefore be ~30% larger than West and East
# stores for the ₹3,400 Cr total to hold. CLAUDE.md does not say this, so
# it is encoded here explicitly rather than left as an accident of tuning.

seed: 20260822

timeline:
  end_date: "2025-11-30"
  months: 18
  # Derived: start_date = end_date - 18 months + 1 day
  current_period: "2025-11"

regions:
  North:
    stores: 118
    annual_net_revenue_inr_cr: 1093.0
    cities: [Delhi, Jaipur, Lucknow, Chandigarh, Kanpur, Agra]
  South:
    stores: 96
    annual_net_revenue_inr_cr: 889.0
    cities: [Bengaluru, Chennai, Hyderabad, Kochi, Coimbatore]
  East:
    stores: 58
    annual_net_revenue_inr_cr: 414.0
    cities: [Kolkata, Bhubaneswar, Guwahati, Patna, Ranchi]
  West:
    stores: 140
    annual_net_revenue_inr_cr: 1004.4
    cities: [Mumbai, Pune, Ahmedabad, Surat, Nagpur, Nashik, Vadodara]

total_stores: 412
total_annual_net_revenue_inr_cr: 3400.4

# --------------------------------------------------------------------------
# Anchor: West monthly revenue in the comparison month. Everything in
# case #2451 is derived from this.
# --------------------------------------------------------------------------
anchors:
  west_net_revenue_oct_2025_inr_cr: 83.70
  east_net_revenue_monthly_inr_cr: 34.5

# --------------------------------------------------------------------------
# Store size distribution. Lognormal within region, then rescaled so the
# region hits its annual target exactly.
# --------------------------------------------------------------------------
store_size:
  distribution: lognormal
  sigma: 0.32
  formats: [High Street, Mall, Factory Outlet]
  format_weights: [0.46, 0.38, 0.16]
  catchment_types: [Metro, Tier1, Tier2]
  catchment_weights: [0.34, 0.40, 0.26]
  sqft_mean: 1850
  sqft_sigma: 420
  staffing_per_1000_sqft: 2.6

  # Blended monthly cost of one store employee, fully loaded. Only used to
  # give `dim_store.staff_cost` a real value: the access policy masks that
  # column from a regional head, and a mask over a column that does not
  # exist is a mask nobody can test.
  monthly_cost_per_head_inr: 28000

# --------------------------------------------------------------------------
# Product catalogue. Deliberately small — the top-20 SKUs are what the
# availability metric measures, and a 60-SKU catalogue keeps the inventory
# snapshot table tractable at four snapshots a day.
# --------------------------------------------------------------------------
catalogue:
  sku_count: 60
  top_n: 20
  categories: [Sports, Casual, Formal, Sandals, Kids]
  category_weights: [0.32, 0.28, 0.16, 0.14, 0.10]
  price_inr:
    Sports: [2200, 5400]
    Casual: [1400, 3600]
    Formal: [2400, 6200]
    Sandals: [700, 2100]
    Kids: [600, 1800]
  # Demand concentration across SKUs (Zipf-like). The top-20 carry most
  # of the volume, which is why a stock-out on them bites.
  demand_zipf_s: 0.85
  units_per_bill_mean: 1.6

# --------------------------------------------------------------------------
# Baseline trade pattern.
# --------------------------------------------------------------------------
trade:
  dow_multipliers:   # Mon..Sun
    - 0.82
    - 0.80
    - 0.86
    - 0.92
    - 1.18
    - 1.46
    - 1.36
  annual_growth: 0.06
  daily_noise_sigma: 0.085
  store_noise_sigma: 0.045
  open_hour_ist: 10
  close_hour_ist: 21

# --------------------------------------------------------------------------
# Netting. net = gross - returns - discount - tax.
# --------------------------------------------------------------------------
netting:
  tax_rate: 0.12
  discount_rate_mean: 0.085
  discount_rate_sigma: 0.02
  return_rate: 0.058
  # DELIBERATE DEFECT: returns are restated up to 3 days after the
  # original bill, so a naive same-day join understates returns.
  return_lag_days_max: 3

# --------------------------------------------------------------------------
# DELIBERATE DEFECTS. Each exists so a downstream stage has something real
# to catch. Removing one silently weakens a demo moment.
# --------------------------------------------------------------------------
defects:
  b2b_bill_share: 0.043          # share of BILLS that are B2B, in bill_lines
  transfer_share_of_rows: 0.021  # inter-store transfers, not sales
  store_code_changes: 3          # three stores change store_code mid-period
  store_code_change_window: ["2025-04-01", "2025-08-31"]

# --------------------------------------------------------------------------
# RECONCILIATION TARGETS. Four disagreements the warehouse must expose
# rather than silently fix. Each is a TARGET the generator solves for; the
# achieved value is measured back into data/raw/manifest.json.
# --------------------------------------------------------------------------
reconciliation:

  # 1. DEFINITION CONFLICT.
  #    Two systems publish a revenue figure for the same period and neither
  #    is the KPI contract's:
  #
  #      pos_ledger  = retail net + B2B     the POS ledger does not know the
  #                                         contract's channel exclusion
  #      marketing   = retail net + returns marketing measures demand at the
  #                                         till and never deducts a return
  #
  #    gap = (pos_ledger - marketing) / marketing = (B2B - returns) / (net + returns)
  #
  #    `returns` is already pinned by netting.return_rate, so the generator
  #    solves the B2B share of net revenue that lands the gap on target.
  definition_conflict:
    target_gap_pct: 4.1
    b2b_lumpiness_sigma: 0.25    # wholesale is lumpy; B2B is not a flat % of every day

  # 2. ENTITY KEY MISMATCH.
  #    POS keys on store_code, ops keys on outlet_id, and dim_store_xref
  #    resolves the two. Three stores were re-fasciad and issued new POS
  #    store_codes; the ops master was never updated, so those codes have no
  #    xref row and their rows cannot be joined. They are quarantined, not
  #    dropped, and the quarantined revenue is counted.
  #
  #    The generator picks WHICH three stores so the quarantined revenue
  #    lands on target — the count is given, the share is solved.
  entity_key_mismatch:
    target_quarantine_revenue_share: 0.004

  # 3. GRAIN MISMATCH.
  #    Marketing spend is booked by ISO week; every other fact is daily.
  #    Allocating it flat within the week is an assumption, not a fact, so
  #    any evidence derived from the allocation carries this tag.
  grain_mismatch:
    allocation: flat_intraweek

  # 4. CALENDAR MISMATCH.
  #    The Indian fiscal year starts 1 April, so fiscal week 1 starts on
  #    1 April whatever weekday that is, while the ISO week always starts on
  #    a Monday. A festival window therefore covers a different share of a
  #    fiscal week than of an ISO week, and the two calendars disagree about
  #    which period a festival's trade belongs to.
  calendar_mismatch:
    fiscal_year_start_month: 4
    fiscal_year_start_day: 1

# --------------------------------------------------------------------------
# Meridian's own promotional calendar. SCHEDULED windows, published months
# ahead — not a spend level.
#
# The distinction decides case #2451. Gate 2's baseline may contain a promo
# regressor because a scheduled sale is a calendar event; it must NEVER
# contain marketing SPEND, because then a spend cut would be absorbed into
# "calendar-expected" and H4 could never be eliminated on precedence. The
# windows below are deliberately in January and July, so they are away from
# every scenario period and can only be fitted, never confounded with one.
# --------------------------------------------------------------------------
promotions:
  uplift: 0.08
  windows:
    - name: End of Season Sale
      start: [1, 10]     # month, day — recurs every year
      end: [2, 5]
    - name: Monsoon Clearance
      start: [7, 1]
      end: [7, 14]

# --------------------------------------------------------------------------
# Restatement register. A restatement is DECLARED by finance, not inferred
# from late-arriving data — which is why Gate 1's fifth check reads this
# table rather than looking at how young the period is.
#
# Every seeded entry is historical and RESOLVED, and none covers a
# scenario period (#2451 Nov-2025 West, #2467 Oct-2025 East, #2470
# 12-Nov-2025 West, #2472 Sep-2025 South). The register exists so the
# check has something real to read; it is not a trap.
# --------------------------------------------------------------------------
restatements:
  register:
    - restatement_id: RS0001
      kpi: net_revenue
      scope: North
      grain: monthly
      period: "2025-07"
      flagged_at: "2025-08-05"
      resolved_at: "2025-08-19"
      status: RESOLVED
      reason: >
        Two Delhi stores double-counted a bulk institutional order across
        the June/July boundary. Both months reissued.
    - restatement_id: RS0002
      kpi: conversion_rate
      scope: South
      grain: monthly
      period: "2025-04"
      flagged_at: "2025-05-11"
      resolved_at: "2025-05-23"
      status: RESOLVED
      reason: >
        Three Bengaluru door counters were double-counting entries after a
        firmware update. Footfall restated, conversion reissued.

# --------------------------------------------------------------------------
# Public reviews. The weakest evidence lane (reliability 0.35). Volume is
# background only — what matters is the competitor-mention count, which
# scenario_2467.yaml pins.
# --------------------------------------------------------------------------
reviews:
  per_store_over_window: 4.0

# --------------------------------------------------------------------------
# Personas. These names must match the `access_policy.personas` keys in
# every KPI contract — engine/db.py::execute_governed resolves a user's
# persona against the contract, and an unknown persona is a hard error.
# --------------------------------------------------------------------------
users:
  email_domain: meridianfootwear.example
  roster:
    - user_id: U001
      display_name: Ananya Rao
      persona: cxo
    # The three P13 names the access-policy tests are written against.
    # Vikram moves from finance_controller to cco: qualify.yaml already
    # escalates to `cco` and no user held it, so the roster had a role
    # the config referred to and nobody occupied.
    - user_id: U002
      display_name: Vikram Shetty
      persona: cco
    - user_id: U003
      display_name: Priya Menon
      persona: regional_manager
      region: West
    - user_id: U004
      display_name: Rahul Bose
      persona: regional_manager
      region: East
    - user_id: U005
      display_name: Sunita Kaur
      persona: regional_manager
      region: North
    # Arjun moves from regional_manager/South to analyst. An analyst is
    # unscoped: the investigation reads every region or it cannot compare
    # them, which is the whole point of the regional residual strip.
    - user_id: U006
      display_name: Arjun Iyer
      persona: analyst
    - user_id: U007
      display_name: Farhan Qureshi
      persona: store_manager
      region: West
      store_rank_in_region: 1
    - user_id: U008
      display_name: Meera Joshi
      persona: analyst
    - user_id: U009
      display_name: Rhea Nair
      persona: regional_head_west
      region: West

# --------------------------------------------------------------------------
# Footfall instrumentation. Partial by design — this is what makes #2467's
# footfall hypothesis untestable at full scope.
# --------------------------------------------------------------------------
footfall:
  west_stores_with_counters: 31   # of 140; the other 109 are null
  other_region_coverage: 0.55
  conversion_rate_base_pt: 22.0

# --------------------------------------------------------------------------
# Emission volume. Bill lines are the only table whose full grain is
# infeasible: 412 stores x 548 days x ~70 bills x 1.6 lines is ~25M rows
# and ~2 GB. The authoritative revenue tables are sales_daily and
# sales_daily_sku; bill_lines carries the line-grain defects and is
# deterministically sampled.
# --------------------------------------------------------------------------
emission:
  bill_lines_sample_rate: 0.02
  bill_lines_window_days: 275
  inventory_snapshot_window_days: 90
  sku_daily_window_days: 120
  snapshot_hours_ist: [6, 12, 18, 23]
  store_notes_per_week_national: 180
