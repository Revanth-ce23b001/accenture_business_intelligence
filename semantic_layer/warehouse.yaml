# Warehouse policy.
#
# CLAUDE.md rule 2: no threshold lives in Python. This file is where the
# warehouse's own constants live — unit conversions, the governance
# bindings `execute_governed` is allowed to fill, and the four
# reconciliation problems the loaders must expose rather than fix.
#
# What is deliberately NOT here: the values the reconciliation produces.
# The definition gap, the quarantined share and the festival overlaps are
# COMPUTED from the loaded data (rule 4). Putting an expected figure here
# would let the engine print a number nobody measured. The registry
# targets are asserted in tests/, which is where a target belongs.

version: 1

# ---------------------------------------------------------------------------
# Unit conversions. Not thresholds, but they are numbers, and rule 2 admits
# no numbers in engine/ at all — so they live here beside the units the KPI
# contracts declare.
# ---------------------------------------------------------------------------
units:
  inr_per_crore: 10000000.0
  inr_per_lakh: 100000.0
  percent_scale: 100.0

  # Precision at which these quantities are QUOTED, not the precision they
  # are computed at. Four places on a crore figure is a hundred rupees;
  # four on a percentage is a hundredth of a basis point. Both are far
  # finer than anything the UI shows, and exist so a stored evidence value
  # never rounds away a difference a test is checking for.
  crore_places: 4
  pct_places: 4

  # Calendar arithmetic. Not policy, but rule 2 admits no numbers in
  # engine/ at all, and a year that is 365.25 days long in one module and
  # 365 in another is a real class of bug.
  days_per_week: 7
  days_per_year: 365.25
  seconds_per_hour: 3600.0
  minutes_per_hour: 60.0
  hours_per_day: 24.0
  months_per_year: 12

# ---------------------------------------------------------------------------
# Governance. `engine/db.py::execute_governed` is the only path to the
# warehouse (CLAUDE.md rule 5). It resolves the caller's persona against the
# KPI contract's access_policy, injects that persona's row predicate, and
# drops that persona's masked columns from the result.
# ---------------------------------------------------------------------------
governance:
  connection_module: engine/db.py
  audit_table: audit_log

  # A KPI contract's `row_predicate` is written against these bind names.
  # execute_governed fills them from the authenticated user; a caller that
  # supplies one itself is refused rather than silently overridden, because
  # that is exactly how a row filter gets bypassed.
  reserved_binding_prefix: "user_"
  reserved_bindings:
    user_region: region
    user_store_id: store_id
    user_persona: persona

  # The predicate that means "no restriction". Written out so the engine
  # never has to know the string.
  unrestricted_predicate: "TRUE"

  # Tables `execute_metadata` is allowed to read. These describe the
  # PIPELINE, not the business: which definition was live, which periods
  # finance reopened, what the calendar is. They hold no measure and no
  # store-level row, so there is nothing for a row predicate to filter and
  # applying one would mean a store manager could not be told which
  # definition their number was computed under.
  #
  # The list is an allow-list precisely so that this cannot become a way
  # to read fact_sales_daily. A test asserts no fact_/doc_/ext_ table is
  # ever added to it.
  metadata_tables:
    - dim_calendar
    - dim_festival_window
    - case_registry
    - kpi_definition_log
    - restatement_register
    # The engine's own track record. Confidences and outcomes, no
    # revenue, no store, no customer — there is nothing in it a row
    # predicate would protect, and every persona needs to see how well
    # the numbers they are being shown have held up.
    - calibration_ledger

  # execute_governed evaluates the row predicate as an extra column on the
  # wrapped query, then splits kept rows from filtered ones in Python, so
  # it can report how many rows the policy removed rather than just how
  # many survived. This is that column's name; it is stripped before the
  # result is returned. Leading underscores keep it out of the way of any
  # real column.
  visibility_column: "__casefile_row_visible"

# ---------------------------------------------------------------------------
# SOURCE REGISTRY.
#
# A KPI contract names the source systems it depends on; this says where
# each one actually lands in the warehouse and which column carries its
# date. Gate 1's freshness check reads it, and it is the only place the
# mapping exists — the `tables:` list on a KPI contract is documentation of
# the source system, written before the warehouse had a shape, and the two
# names do not always match.
#
# `date_column: null` marks a static master. A master has no arrival time,
# so it cannot be stale; the check reports it as static rather than
# inventing a freshness of zero and calling it fresh.
# ---------------------------------------------------------------------------
# `scope_join` says how a row in this source is tied to the estate, which
# is what lets the freshness query carry the column a persona's row
# predicate binds to:
#
#   region    the table carries `region` itself
#   store_id  join dim_store to get `region`
#   none      the source is national and has no store dimension. A scoped
#             persona cannot read it, and Gate 1 reports that as an
#             unverifiable source rather than pretending it checked.
sources:
  pos:
    table: fact_sales_daily
    date_column: txn_date
    grain: daily
    scope_join: region
    description: Point-of-sale daily net revenue, the authoritative fact.
  returns:
    table: fact_bill_lines
    date_column: posted_date
    grain: daily
    scope_join: store_id
    description: >
      Returns credit against the bill's posting date, which is up to three
      days after the sale. This feed therefore holds rows dated AFTER the
      newest sales row, and a negative staleness is clamped to zero.
  erp:
    table: dim_store
    date_column: null
    grain: static
    scope_join: region
    description: Store and organisation master. Static.
  pricing:
    table: dim_sku
    date_column: null
    grain: static
    scope_join: none
    description: Product and list-price master. Static.
  footfall:
    table: fact_footfall_daily
    date_column: footfall_date
    grain: daily
    scope_join: store_id
    description: Door-sensor counts. Partial estate coverage.
  wms:
    table: fact_inventory_snapshot
    date_column: snapshot_date
    grain: daily
    scope_join: store_id
    description: Warehouse and store stock snapshots, four a day.
  qcomm_oms:
    table: fact_qcomm_weekly
    date_column: week_start
    grain: weekly
    scope_join: none
    # The table names its own scope rather than carrying a region.
    scope_column: scope
    description: Quick-commerce order management, weekly. National, no store key.
  store_notes:
    table: doc_store_notes
    date_column: note_date
    grain: daily
    scope_join: store_id
    description: Free-text shift notes.
  support_tickets:
    table: doc_tickets
    date_column: created_date
    grain: daily
    scope_join: store_id
    description: >
      Customer support tickets. The `category` field is filled in by
      whoever took the call and is wrong about a quarter of the time; the
      body is the truth.
  review_feed:
    table: doc_reviews
    date_column: review_date
    grain: daily
    scope_join: store_id
    description: >
      Public reviews. The weakest tier there is — no verified-purchase
      flag, no competitor price. It can corroborate and never test.
  competitor_news:
    table: ext_competitor_news
    date_column: published_date
    grain: daily
    scope_join: none
    description: >
      External news mentions. No price column and no footfall column,
      because the organisation holds neither — which is what makes
      competitor_action unverifiable rather than merely unproven.
  weather_feed:
    table: ext_weather_daily
    date_column: weather_date
    grain: daily
    scope_join: region
    description: Daily rainfall and temperature by city.
  marketing_spend:
    table: fact_marketing_spend_weekly
    date_column: week_start
    grain: weekly
    scope_join: region
    description: Media and trade spend by region and ISO week.
  promo_calendar:
    table: dim_calendar
    date_column: date
    grain: daily
    scope_join: none
    description: Scheduled promotional windows, carried on the calendar.

# ---------------------------------------------------------------------------
# EVIDENCE.
#
# Every number the engine emits is an `Evidence` record, and every record
# names WHERE it came from and HOW it was made. Both vocabularies live here
# so that a typo is a load-time failure rather than an unqueryable string in
# a table, and so the UI can map either one to an icon without guessing.
# ---------------------------------------------------------------------------
evidence:

  # `source_system` is normally a key in `sources` above. These are the
  # origins that are not source systems but are still an honest answer to
  # "where did this come from".
  non_source_origins:
    derived: >
      Computed from other evidence rather than read from anywhere. Its
      lineage names the evidence it was computed from.
    semantic_layer: >
      A contract, threshold, definition or weight, read from YAML. The
      business wrote it down; the engine did not compute it.
    warehouse: >
      The warehouse's own metadata — the calendar, the case registry, the
      definition log. Describes the pipeline, not the business.

  # `method` — how the value was produced. The headline method for the
  # record; the lineage carries the individual steps.
  methods:
    sql: Read from the warehouse by a statement, retained verbatim.
    ols: Ordinary least squares.
    stl: Seasonal-trend decomposition.
    quantile: An empirical quantile of an observed distribution.
    ratio: One quantity divided by another.
    difference: One quantity subtracted from another.
    scale: A unit conversion or rescaling.
    count: A count of rows or of things.
    allocate: A quantity spread across a finer grain under an assumption.
    compare: A comparison against a threshold, a band or a peer.
    hash: A content fingerprint.
    lookup: Read straight off a contract or a register.
    # ADJUDICATE's five. Each names a published method, not a description
    # of one: a reader who does not trust the number can look the method
    # up and re-run it.
    changepoint: PELT changepoint detection on a series.
    elasticity: A log-log elasticity fitted by least squares.
    welch_t: Welch's unequal-variance t-test between two groups.
    did: Difference-in-differences against a matched control group.
    balance: A covariate balance test between treated and control.

# ---------------------------------------------------------------------------
# RECONCILIATION.
#
# Four disagreements exist in the source systems. None is repaired on load.
# Each is computed, named, and written to `data_gap_register` so it appears
# in the case file rather than in a footnote.
# ---------------------------------------------------------------------------
reconciliation:
  version: 1

  # 1. DEFINITION CONFLICT ---------------------------------------------------
  #    Three figures exist for "revenue in period P" and they disagree.
  #    The KPI contract is the arbiter; the other two are recorded, not
  #    corrected, because both are defensible inside the team that
  #    publishes them.
  definition_conflict:
    kpi: net_revenue
    fact_table: fact_sales_daily
    arbiter: contract
    definitions:
      contract:
        label: Net revenue (KPI contract)
        owner: finance_controller
        expression: "SUM(net_revenue_inr)"
        rationale: >
          Retail only, transfers excluded, net of returns, discount and
          tax. This is semantic_layer/kpis/net_revenue.yaml, and it is what
          a case is opened on.
      pos_ledger:
        label: POS ledger revenue (includes B2B)
        owner: retail_operations_lead
        expression: "SUM(net_revenue_inr + b2b_net_revenue_inr)"
        rationale: >
          Everything that settled through the till, wholesale included.
          The POS system does not hold the contract's channel exclusion,
          so its out-of-the-box revenue report is larger by the B2B book.
      marketing_reported:
        label: Marketing reported revenue (excludes returns)
        owner: marketing_lead
        expression: "SUM(net_revenue_inr + returns_amount_inr)"
        rationale: >
          Demand generated at the point of sale. Marketing does not deduct
          a return, on the argument that a return is a fulfilment failure
          and not a failure of the campaign that produced the sale.
    gap:
      numerator: pos_ledger
      denominator: marketing_reported
      unit: pct
    gap_code: DEFINITION_CONFLICT
    # Severity is declared, not derived. A definition conflict is a
    # WARNING because the arbiter resolves it: a case still computes, it
    # just has to say which figure it used and by how much the others
    # differ. The key mismatch is an ERROR because revenue is being held
    # out of every number the warehouse publishes.
    severity: WARNING
    shared_exclusion:
      column: transfer_amount_inr
      note: >
        All three definitions exclude inter-store transfers. Carried at
        daily grain so the exclusion can be shown rather than asserted.

  # 2. ENTITY KEY MISMATCH ---------------------------------------------------
  #    POS keys on store_code, store operations keys on outlet_id, and
  #    dim_store_xref is the only bridge. Three stores were re-fasciad, the
  #    POS system issued new store_codes, and nobody told operations.
  entity_key_mismatch:
    pos_key: store_code
    ops_key: outlet_id
    bridge_table: dim_store_xref
    fact_table: fact_sales_daily
    measure: net_revenue_inr
    # Quarantine, never drop and never guess. An unmapped row is held
    # aside, counted, and reported as a share of revenue; imputing the
    # mapping would make the gap invisible, which is the failure mode.
    policy: quarantine
    gap_code: UNMAPPED_STORE_KEY
    severity: ERROR

  # 3. GRAIN MISMATCH --------------------------------------------------------
  #    Marketing spend is booked by ISO week. Everything it is compared
  #    against is daily. Splitting the week evenly is an assumption about
  #    intra-week spend that nobody has verified, so every value derived
  #    from the split carries the tag and the tag rides on the Evidence.
  grain_mismatch:
    source_table: fact_marketing_spend_weekly
    source_grain: iso_week
    target_grain: daily
    method: flat_intraweek
    assumption_tag: flat_intraweek
    days_per_week: 7
    gap_code: WEEKLY_SPEND_ALLOCATED_FLAT
    severity: ASSUMPTION
    note: >
      Weekend spend almost certainly exceeds Tuesday spend. Until a daily
      feed exists, the allocation is flat and says so.

  # 4. CALENDAR MISMATCH -----------------------------------------------------
  #    The fiscal week counts from 1 April whatever weekday that is; the
  #    ISO week always starts on a Monday. A festival window therefore
  #    covers a different share of a fiscal period than of an ISO period,
  #    and the two calendars disagree about which period a festival's trade
  #    belongs to.
  calendar_mismatch:
    calendar_table: dim_calendar
    date_column: date
    festival_column: festival
    festival_flag_column: is_festival
    gap_code: FISCAL_ISO_WEEK_DIVERGENCE
    severity: WARNING
    periods:
      month:
        label: Calendar month
        column: period_month
      iso_week:
        label: ISO week
        column: iso_week_start
      fiscal_week:
        label: Fiscal week
        column: fiscal_week_start
    # Which pair the divergence headline is quoted between.
    compare: [iso_week, fiscal_week]
